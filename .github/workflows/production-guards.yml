name: Production source guards
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  source-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run setup:validator
      - run: node tools/generate-account-deletion-pins.mjs --check
      - run: node apps/mini-app/tests/verify-backend-targets.mjs
      - run: node --test apps/telegram-bot/tests/*.test.mjs
      - run: npm run typecheck
      - run: node --test tests/cloudflare/*.test.mjs tests/clerk-auth/*.test.mjs
      # Directory fsync durability is exercised on Linux, not silently weakened on Windows.
      - run: node --test tests/storage-auth/*.test.mjs tests/persistent-http/*.test.mjs tests/enrollment/identity-staff.test.mjs tests/first-test/*.test.mjs tests/vercel-node/*.test.mjs
      - run: node --test apps/mini-app/tests/path-containment.test.mjs
      - run: npm ci --prefix tests/account-deletion/tooling --no-audit --no-fund
      - run: npm ci --ignore-scripts --prefix apps/mini-app --no-audit --no-fund
      - run: node --test tests/account-deletion/*.test.mjs tests/telegram-entry/*.test.mjs apps/mini-app/tests/account-deletion-*.test.mjs apps/mini-app/tests/telegram-atomic-*.test.mjs
      - run: node tests/account-deletion/run-native.mjs
      - run: node tests/telegram-entry/run-native.mjs
      - run: node --test apps/mini-app/tests/dashboard-*.test.mjs
      - run: npm --prefix apps/mini-app run build
        env:
          VITE_AUTH_ENTRY: common
          VITE_TELEGRAM_ATOMIC_ENTRY: "true"
          VITE_TELEGRAM_SDK_ENABLED: "true"
          VITE_ACCOUNT_DELETION_ENABLED: "true"
